[env:m5stick-c]
platform = espressif32
board = m5stick-c
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
build_flags = 
    -DCORE_DEBUG_LEVEL=0
lib_deps = 
    m5stack/M5Unified@^0.1.16
    m5stack/M5StickCPlus2@^1.0.2
    adafruit/DHT sensor library@^1.4.4
    knolleary/PubSubClient@^2.8